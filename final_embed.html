<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Calendar | Feb 18 - Apr 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #f6b23b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --hover-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 1rem;
            min-height: 100vh;
        }

        h1,
        h2,
        .subtitle {
            font-family: 'Outfit', sans-serif;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }

        .day-cell:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
            border-color: var(--accent-color);
            background: #fffcf5;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            pointer-events: none;
        }

        .day-name {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .day-number {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .day-cell.today {
            background: #eff6ff;
            border-color: var(--accent-color);
        }

        .day-cell.today .day-number {
            color: var(--accent-color);
        }

        .events-list {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .event-item {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #fff7ed;
            color: #9a3412;
            border-left: 2px solid #f97316;
            display: flex;
            gap: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .event-item:hover {
            filter: brightness(0.95);
            transform: scale(1.02);
        }

        .more-indicator {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-color);
            padding: 2px 4px;
            text-align: center;
            background: #fffbeb;
            border-radius: 4px;
            margin-top: auto;
        }

        .event-time {
            font-weight: 700;
            flex-shrink: 0;
        }

        .event-summary {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: modalSlide 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }

        .modal-description {
            margin-top: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            overflow-y: auto;
            padding-right: 5px;
        }

        .day-events-modal-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .day-event-modal-item {
            padding: 10px 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-event-modal-item:hover {
            border-color: var(--accent-color);
            background: #fffbeb;
            transform: translateX(4px);
        }

        .day-event-modal-header {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .day-event-modal-header .event-time {
            color: var(--accent-color);
            background: #fff7ed;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .day-event-modal-header .event-summary {
            font-weight: 600;
            color: var(--text-primary);
            white-space: normal;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-time {
            color: var(--text-secondary);
            font-weight: 500;
            margin: 5px 0 15px 0;
            font-size: 0.9rem;
        }

        .modal-description-content {
            white-space: pre-wrap;
        }

        .loader {
            grid-column: span 7;
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        @media (max-width: 1024px) {
            .calendar-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 640px) {
            .calendar-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
                gap: 6px;
            }

            header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body class="light-mode">
    <div class="app-container">

        <div id="calendar-grid" class="calendar-grid">
            <div class="loader">
                <div class="spinner"></div>
                <p>Connecting to Google Calendar...</p>
            </div>
        </div>

        <footer>
            <div class="status-indicator">
                <span id="update-timer">Initializing...</span>
            </div>
        </footer>
    </div>

    <!-- Modal for Day Events List -->
    <div id="day-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDayModal()">&times;</span>
            <h2 id="day-modal-title"></h2>
            <p id="day-modal-time" class="modal-time"></p>
            <div id="day-modal-desc" class="modal-description"></div>
        </div>
    </div>

    <!-- Modal for Event Details -->
    <div id="event-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="event-title"></h2>
            <p id="event-time" class="modal-time"></p>
            <div id="event-desc" class="modal-description"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: 'AIzaSyCzn7qHU1jhLErImblzuB4Ufub8FJBljCM',
            calendarId: '5c0d965e5bb8cfbf96647f5a08b4cea6c48be19d40dd005496ae8865ba8a04cc@group.calendar.google.com',
            startDate: '2026-02-18',
            endDate: '2026-04-04',
            pollInterval: 5 * 60 * 1000
        };

        const calendarGrid = document.getElementById('calendar-grid');
        const lastUpdatedText = document.getElementById('update-timer');

        const eventModal = document.getElementById('event-modal');
        const eventTitle = document.getElementById('event-title');
        const eventTime = document.getElementById('event-time');
        const eventDesc = document.getElementById('event-desc');

        const dayModal = document.getElementById('day-modal');
        const dayModalTitle = document.getElementById('day-modal-title');
        const dayModalTime = document.getElementById('day-modal-time');
        const dayModalDesc = document.getElementById('day-modal-desc');

        let eventsByDate = {}; // Store events grouped by date

        function generateCalendar() {
            const start = new Date(CONFIG.startDate);
            const startDate = new Date(start);
            startDate.setDate(start.getDate() - start.getDay());

            calendarGrid.innerHTML = '';

            for (let i = 0; i < 49; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);

                const dateStr = currentDate.toISOString().split('T')[0];

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (dateStr === new Date().toISOString().split('T')[0]) {
                    cell.classList.add('today');
                }

                cell.onclick = (e) => {
                    if (!e.target.closest('.event-item')) {
                        showDayModal(dateStr);
                    }
                };

                cell.innerHTML = `
                    <div class="day-header">
                        <span class="day-name">${currentDate.toLocaleString('default', { weekday: 'short' })}</span>
                        <span class="day-number">${currentDate.getDate()} ${currentDate.toLocaleString('default', { month: 'short' })}</span>
                    </div>
                    <div class="events-list" id="events-${dateStr}"></div>
                `;

                calendarGrid.appendChild(cell);
            }
        }

        async function fetchEvents() {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CONFIG.calendarId)}/events?key=${CONFIG.apiKey}&timeMin=${new Date(CONFIG.startDate).toISOString()}&timeMax=${new Date(CONFIG.endDate).toISOString()}&singleEvents=true&orderBy=startTime`
                );

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                const events = data.items.map(item => {
                    const startDateTime = item.start.dateTime || item.start.date;
                    let startTime = '';

                    if (item.start.dateTime) {
                        const date = new Date(item.start.dateTime);
                        startTime = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
                    }

                    return {
                        start: startDateTime.split('T')[0],
                        time: startTime,
                        summary: item.summary,
                        description: item.description || 'No description provided.'
                    };
                });

                renderEvents(events);
            } catch (error) {
                console.error('Error fetching events:', error);
                lastUpdatedText.textContent = 'Connection Error - Check API Key & Calendar Visibility';
            }
        }

        function renderEvents(events) {
            eventsByDate = {};
            const lists = document.querySelectorAll('.events-list');
            lists.forEach(l => l.innerHTML = '');

            events.forEach(event => {
                if (!eventsByDate[event.start]) {
                    eventsByDate[event.start] = [];
                }
                eventsByDate[event.start].push(event);
            });

            Object.keys(eventsByDate).forEach(date => {
                const listContainer = document.getElementById(`events-${date}`);
                if (listContainer) {
                    const dayEvents = eventsByDate[date];
                    const isMobile = window.innerWidth <= 640;
                    const isTablet = window.innerWidth <= 1024 && window.innerWidth > 640;
                    const limit = isMobile ? 2 : (isTablet ? 3 : 4);

                    dayEvents.slice(0, limit).forEach(event => {
                        const eventEl = document.createElement('div');
                        eventEl.className = 'event-item';
                        eventEl.innerHTML = `
                            ${event.time ? `<span class="event-time">${event.time}</span>` : ''}
                            <span class="event-summary">${event.summary}</span>
                        `;
                        eventEl.onclick = (e) => {
                            e.stopPropagation();
                            showModal(event.summary, event.time, event.description);
                        };
                        listContainer.appendChild(eventEl);
                    });

                    if (dayEvents.length > limit) {
                        const moreEl = document.createElement('div');
                        moreEl.className = 'more-indicator';
                        moreEl.textContent = `+${dayEvents.length - limit} more`;
                        listContainer.appendChild(moreEl);
                    }
                }
            });

            const now = new Date();
            lastUpdatedText.textContent = `Last updated: ${now.toLocaleTimeString()}`;
        }

        function showModal(title, time, desc) {
            eventTitle.textContent = title;
            eventTime.textContent = time ? `Time: ${time}` : 'All Day';
            eventDesc.innerHTML = `<div class="modal-description-content">${desc}</div>`;
            eventModal.classList.add('active');
        }

        function showDayModal(dateStr) {
            const dayEvents = eventsByDate[dateStr] || [];
            const date = new Date(dateStr);
            const formattedDate = date.toLocaleDateString('default', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            dayModalTitle.textContent = `Events for ${formattedDate}`;
            dayModalTime.textContent = dayEvents.length > 0 ? `${dayEvents.length} event(s)` : 'No events scheduled';

            if (dayEvents.length > 0) {
                let eventsHtml = '<div class="day-events-modal-list">';
                dayEvents.forEach(event => {
                    eventsHtml += `
                        <div class="day-event-modal-item" onclick="showModal('${event.summary.replace(/'/g, "\\'")}', '${event.time}', '${event.description.replace(/'/g, "\\'").replace(/\n/g, "<br>")}')">
                            <div class="day-event-modal-header">
                                ${event.time ? `<span class="event-time">${event.time}</span>` : '<span class="event-time">All Day</span>'}
                                <span class="event-summary">${event.summary}</span>
                            </div>
                        </div>
                    `;
                });
                eventsHtml += '</div>';
                dayModalDesc.innerHTML = eventsHtml;
            } else {
                dayModalDesc.innerHTML = '<p>No events found for this day.</p>';
            }

            dayModal.classList.add('active');
        }

        function closeModal() {
            eventModal.classList.remove('active');
        }

        function closeDayModal() {
            dayModal.classList.remove('active');
        }

        window.onclick = (event) => {
            if (event.target == eventModal) {
                closeModal();
            } else if (event.target == dayModal) {
                closeDayModal();
            }
        };

        let resizeTimer;
        window.onresize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const allEvents = Object.values(eventsByDate).flat();
                renderEvents(allEvents);
            }, 250);
        };

        generateCalendar();
        fetchEvents();
        setInterval(fetchEvents, CONFIG.pollInterval);
    </script>
</body>
</body>

</html>
